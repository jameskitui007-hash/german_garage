<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Mercedes & BMW Parts</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Work Sans', sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      background: white;
      padding: 3rem;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 400px;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-header h1 {
      font-family: 'Oswald', sans-serif;
      color: #0a0a0a;
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    .brand-header p {
      color: #c40000;
      font-size: 0.9rem;
      letter-spacing: 2px;
    }

    .login-form .form-group {
      margin-bottom: 1.5rem;
    }

    .login-form label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: #333;
      font-size: 0.9rem;
    }

    .login-form input {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 2px solid #ddd;
      border-radius: 4px;
      font-family: 'Work Sans', sans-serif;
      font-size: 1rem;
      transition: border-color 0.3s;
    }

    .login-form input:focus {
      outline: none;
      border-color: #c40000;
    }

    .login-btn {
      width: 100%;
      padding: 1rem;
      background: #c40000;
      color: white;
      border: none;
      border-radius: 4px;
      font-family: 'Oswald', sans-serif;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: background 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .login-btn:hover   { background: #a30000; }
    .login-btn:disabled { background: #999; cursor: not-allowed; }

    .error-message {
      background: #ffebee;
      color: #c62828;
      padding: 0.8rem;
      border-radius: 4px;
      margin-bottom: 1rem;
      text-align: center;
      display: none;
    }

    .security-note {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #eee;
      text-align: center;
      font-size: 0.8rem;
      color: #666;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="brand-header">
      <h1>MERCEDES & BMW</h1>
      <p>PARTS ADMIN PORTAL</p>
    </div>

    <div class="error-message" id="errorMessage">
      Invalid username or password
    </div>

    <form class="login-form" id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required
               placeholder="Enter admin username" autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required
               placeholder="Enter password" autocomplete="current-password">
      </div>

      <button type="submit" class="login-btn" id="loginBtn">
        <span class="spinner" id="spinner"></span>
        <span id="btnText">Login to Dashboard</span>
      </button>
    </form>

    <div class="security-note">
      <p>🔒 Restricted Access — Authorized Personnel Only</p>
      <p>Logins are monitored and recorded</p>
    </div>
  </div>

  <script>
    const API_BASE = "http://127.0.0.1:8000";

    // Already logged in? Skip straight to dashboard
    if (localStorage.getItem("adminToken")) {
      window.location.href = "admin-dashboard.html";
    }

    document.getElementById("loginForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const username    = document.getElementById("username").value.trim();
      const password    = document.getElementById("password").value;
      const btn         = document.getElementById("loginBtn");
      const spinner     = document.getElementById("spinner");
      const btnText     = document.getElementById("btnText");
      const errorDiv    = document.getElementById("errorMessage");

      // Show loading state
      btn.disabled          = true;
      spinner.style.display = "block";
      btnText.textContent   = "Logging in...";
      errorDiv.style.display = "none";

      try {
        const response = await fetch(`${API_BASE}/api/auth/login`, {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify({ username, password }),
        });

        const data = await response.json();

        if (!response.ok) {
          // 401 = wrong credentials, show error
          throw new Error(data.detail || "Login failed");
        }

        // Store JWT and session info
        localStorage.setItem("adminToken", data.access_token);
        localStorage.setItem("adminLoggedIn", "true");
        localStorage.setItem("adminSession", JSON.stringify({
          name:      data.admin_name,
          role:      data.admin_role,
          username,
          loginTime: new Date().toISOString(),
        }));

        // Redirect to dashboard
        window.location.href = "admin-dashboard.html";

      } catch (err) {
        errorDiv.textContent   = err.message || "Login failed. Please try again.";
        errorDiv.style.display = "block";

        // Reset button
        btn.disabled          = false;
        spinner.style.display = "none";
        btnText.textContent   = "Login to Dashboard";
      }
    });
  </script>
</body>
</html>
